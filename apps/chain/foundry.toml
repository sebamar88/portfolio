[profile.default]
src = "src"
out = "out"
libs = ["dependencies"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64

[fmt]
line_length = 100
tab_width = 4

[dependencies]
"@openzeppelin-contracts" = "5.1.0"
forge-std = "1.9.4"

[soldeer]
remappings_generate = false
remappings_regenerate = false
