# Local development database. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: expenses
      POSTGRES_USER: expenses
      POSTGRES_PASSWORD: expenses
    volumes:
      # Named volume: data survives container restarts and `docker compose down`.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U expenses -d expenses']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
