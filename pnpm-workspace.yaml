packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  esbuild: true
  # Only used by the sass CLI watcher; Vite does its own watching.
  "@parcel/watcher": false
  # The native SWC binary ships as a platform optional dependency; the postinstall is only a fallback.
  "@swc/core": false
  # Testcontainers' optional native speedups (SSH/CPU detection); the pure-JS fallbacks are fine for tests.
  cpu-features: false
  ssh2: false
  # Its postinstall only checks its own version scheme.
  protobufjs: false
  # Swagger UI's install hook only sends analytics; not needed.
  "@scarf/scarf": false
