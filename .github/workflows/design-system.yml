name: Design system

on:
  push:
    branches: [main]
    paths:
      - 'packages/design-system/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/pages/**'
      - '.github/workflows/design-system.yml'
  pull_request:
    paths:
      - 'packages/design-system/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/pages/**'
      - '.github/workflows/design-system.yml'
  workflow_dispatch:

# A newer push cancels a stale run of the same branch instead of queueing behind it.
concurrency:
  group: design-system-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/design-system

jobs:
  check:
    name: Lint, type check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        # One lockfile for the whole workspace: always install from the repo root.
        working-directory: .

      # Story tests run in a real Chromium; --with-deps adds the OS libraries it needs.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm build

      # Unit tests (Node) + story tests (Chromium) with a11y checks in error mode, plus coverage thresholds.
      - name: Test with coverage
        run: pnpm test:coverage

      - name: Coverage summary
        if: always() && hashFiles('packages/design-system/coverage/coverage-summary.json') != ''
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Build Storybook
        run: pnpm build-storybook

      # ONE site, ONE deploy: GitHub Pages serves a single artifact, so every static module must be
      # assembled into this same _site directory (landing page at /, each module under /<module>/).
      # When more static modules exist, add their build output here as _site/<module>/.
      - name: Assemble GitHub Pages site
        if: github.event_name != 'pull_request'
        working-directory: .
        run: |
          mkdir -p _site/design-system
          cp .github/pages/index.html _site/index.html
          cp -r packages/design-system/storybook-static/. _site/design-system/

      - name: Upload site for GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Screenshots only match inside the pinned Playwright image (same one as scripts/visual-docker.sh,
  # which devs run locally via `pnpm test:visual`). Keep the tag in sync with the playwright version.
  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        # One lockfile for the whole workspace: always install from the repo root.
        working-directory: .

      - name: Visual regression tests
        run: pnpm test:visual:ci

      - name: Upload actual and diff images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: packages/design-system/.vitest/attachments
          if-no-files-found: ignore

  deploy:
    name: Deploy site (landing page + Storybook)
    # Only after every check passed, and never from a pull request.
    needs: [check, visual]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
